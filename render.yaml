# Render Blueprint — auto-deploys from GitHub (no Docker).
# Dashboard: New → Blueprint → connect repo dev-trinity-cat/SIH-059
#
# After first deploy, set these on sih059-ml if you host weights off GitHub:
#   MODEL_URL, SPATIAL_MASK_URL, LATITUDE_GRID_URL, LONGITUDE_GRID_URL, NC_URL
#
# TensorFlow needs more than the free 512 MB plan. Upgrade sih059-ml to Starter
# (or larger) if the ML service is killed or /api/health shows ml_service unavailable.

services:
  - type: web
    name: sih059-ml
    runtime: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: python download_artifacts.py && gunicorn -w 1 -b 0.0.0.0:$PORT --timeout 180 app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: MODEL_URL
        sync: false
      - key: SPATIAL_MASK_URL
        sync: false
      - key: LATITUDE_GRID_URL
        sync: false
      - key: LONGITUDE_GRID_URL
        sync: false
      - key: NC_URL
        sync: false

  - type: web
    name: sih059-app
    runtime: node
    buildCommand: cd Frontend && npm install && npm run build && cd ../backend && npm install
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: ML_SERVICE_URL
        fromService:
          type: web
          name: sih059-ml
          envVarKey: RENDER_EXTERNAL_URL
